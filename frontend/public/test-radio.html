<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>单选按钮测试</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
        }
        .radio-group {
            display: flex;
            gap: 20px;
            margin: 20px 0;
        }
        .radio-label {
            display: flex;
            align-items: center;
            cursor: pointer;
        }
        .radio-label input {
            width: 16px;
            height: 16px;
            margin-right: 8px;
        }
        .content {
            margin-top: 20px;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <h1>配置类型选择测试</h1>

    <div>
        <label style="font-weight: bold; display: block; margin-bottom: 10px;">
            配置类型
        </label>
        <div class="radio-group">
            <label class="radio-label">
                <input type="radio" name="configType" value="preset" checked onchange="updateContent()">
                <span>预设模型 (OpenAI/Claude/Gemini)</span>
            </label>
            <label class="radio-label">
                <input type="radio" name="configType" value="custom" onchange="updateContent()">
                <span>自定义模型 (DeepSeek/Qwen/Ollama等)</span>
            </label>
        </div>
    </div>

    <div class="content" id="content">
        <p>当前选择：<strong id="selected">预设模型</strong></p>
    </div>

    <script>
        function updateContent() {
            const selected = document.querySelector('input[name="configType"]:checked').value;
            document.getElementById('selected').textContent =
                selected === 'preset' ? '预设模型' : '自定义模型';
        }
    </script>
</body>
</html>
